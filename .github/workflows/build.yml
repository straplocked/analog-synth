name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: macOS
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Build tests
        run: cmake --build build --config Release --target AnalogSynthTests

      - name: Run tests
        run: ./build/AnalogSynthTests

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-plugins
          path: |
            build/AnalogSynth_artefacts/**/*.app
            build/AnalogSynth_artefacts/**/*.vst3
            build/AnalogSynth_artefacts/**/*.component

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Build tests
        run: cmake --build build --config Release --target AnalogSynthTests

      - name: Run tests
        run: ./build/Release/AnalogSynthTests.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-plugins
          path: |
            build/AnalogSynth_artefacts/**/*.exe
            build/AnalogSynth_artefacts/**/*.vst3

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev
          libx11-dev
          libxrandr-dev
          libxcursor-dev
          libxinerama-dev
          libfreetype-dev
          libfontconfig1-dev
          libgl1-mesa-dev
          libwebkit2gtk-4.1-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release

      - name: Build tests
        run: cmake --build build --config Release --target AnalogSynthTests

      - name: Run tests
        run: ./build/AnalogSynthTests

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-plugins
          path: |
            build/AnalogSynth_artefacts/**/*Standalone*
            build/AnalogSynth_artefacts/**/*.vst3
